plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'java-library'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://api.minecraftforge.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

java {
    withSourcesJar()
}

loom {
    runs {
        server {
            clientArguments "--nogui"
        }
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// Native library configuration
ext {
    nativeOutputDir = file("${buildDir}/native")
    vulkanSdk = System.getenv('VULKAN_SDK') ?: 'C:/VulkanSDK/1.3.290.0'
}

task compileNative(type: Exec) {
    workingDir 'native'
    if (System.getProperty('os.name').toLowerCase().contains('win')) {
        commandLine 'cmd', '/c', 'build.bat'
    } else {
        commandLine 'sh', 'build.sh'
    }
    dependsOn 'processResources'
}

task runGGU(type: JavaExec) {
    group = 'ggu'
    description = 'Run GGU-enhanced server'
    classpath = sourceSets.main.runtimeClasspath
    environment 'GGU_NATIVE_LIB', "${nativeOutputDir}/libgpu_native.dll"
    jvmArgs '-Dggu.enable=true', '-Dggu.verbose=false'
}

// Native build configuration
task nativeLib(type: Copy) {
    from 'build/native'
    into 'src/main/resources/ggu/native/lib'
}

postBuildDependsOn 'compileNative'